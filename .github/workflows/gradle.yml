name: Flarecord JAR

on:
  workflow_dispatch:
  push:
    branches:
      - dev/1.0.0
  pull_request:
    branches:
      - dev/1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build proxy JAR
        run: ./gradlew :velocity-proxy:shadowJar
      - name: Upload proxy JAR
        uses: actions/upload-artifact@v4
        with:
          name: flarecord-${{ github.sha }}
          path: proxy/build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 14
